apiVersion: 1
deleteDatasources:
  # Grafana deletes by name and org, not UID. Legacy volumes persist this
  # predecessor name, so remove it before reusing the stable UID below.
  - name: Codex project discovery
    orgId: 1
datasources:
  - name: Codex projects
    uid: codex-projects
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      timeRangeForTags: 604800
