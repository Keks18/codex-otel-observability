apiVersion: 1

providers:
  - name: Codex
    orgId: 1
    folder: Codex
    type: file
    disableDeletion: true
    allowUiUpdates: false
    # More than 10 seconds forces polling; Docker bind mounts may lose watch events.
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/codex
      foldersFromFilesStructure: false
