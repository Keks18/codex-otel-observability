global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 1m
  scrape_native_histograms: true

storage:
  tsdb:
    out_of_order_time_window: 10m

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias

scrape_configs:
  - job_name: tempo
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:3200"]
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ["codex-otel-collector:8888"]
